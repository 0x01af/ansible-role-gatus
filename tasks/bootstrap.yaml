---
- name: "Gatus K8s deployment: bootstrap"
  when: gatus.version != 'none'
  block:
    - name: "deploy prerequisites of gatus"
      kubernetes.core.k8s:
        state: present
        template: 'gatus-k8s-prerequisites.yaml.j2'
      register: _gatus_prerequisites
    - name: "deploy gatus"
      kubernetes.core.k8s:
        state: present
        template: 'gatus-k8s-deployment.yaml.j2'
      register: _gatus_deployment
    - name: "force pod recreation via Rollout (Clean Sledgehammer)"
      when: _gatus_prerequisites.changed or _gatus_deployment.changed
      kubernetes.core.k8s:
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: gatus-app
            namespace: "{{ gatus.namespace }}"
          spec:
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/restartedAt: "{{ ansible_date_time.iso8601 }}"
        state: patched
    - name: "configure ingress for gatus"
      kubernetes.core.k8s:
        state: present
        template: 'gatus-k8s-ingress.yaml.j2'
